name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write # upload the zip to the release
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: "Adjust version number"
        shell: "bash"
        env:
          # Passed as data, not pasted into the script.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          yq -i -o json '.version = strenv(TAG)' \
            "${{ github.workspace }}/custom_components/flashforge/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/flashforge"
          zip FlashForge.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: ${{ github.workspace }}/custom_components/flashforge/FlashForge.zip
