pause:
  name: Pause
  description: Pause current print.
continue_print:
  name: Continue print
  description: Continue current print.
abort:
  name: Abort
  description: Abort current print.
get_file_names:
  name: Get file names
  description: Get the files that stored in printer.
print_file:
  name: Print file
  description: Print file stored in printer.
  fields:
    file_name:
      name: "file name"
      description: "Name of a file stored on the printer, without the /data/ prefix. Line breaks, ~, / and \ are not allowed."
      example: "Apos_PLA_14m16s.gcode"
      required: true
      selector:
        text:
