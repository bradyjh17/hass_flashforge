---
name: "Bug report"
description: "Report a problem with the integration"
body:
- type: markdown
  attributes:
    value: |
      Thanks for reporting. Please search the [existing issues](https://github.com/bradyjh17/hass_flashforge/issues?q=is%3Aissue) first.
- type: input
  attributes:
    label: "Printer model"
    placeholder: "Adventurer 5M"
  validations:
    required: true
- type: input
  attributes:
    label: "Printer firmware version"
    description: "Shown in the printer's settings, under About."
    placeholder: "5.2.0"
  validations:
    required: true
- type: input
  attributes:
    label: "Home Assistant version"
    placeholder: "2026.11.1"
  validations:
    required: true
- type: textarea
  attributes:
    label: "What happened"
    description: "What you expected, and what happened instead."
  validations:
    required: true
- type: textarea
  attributes:
    label: "Steps to reproduce"
    value: |
      1.
      2.
      3.
- type: textarea
  attributes:
    label: "Diagnostics file"
    description: |
      Settings → Devices & services → FlashForge → three-dot menu → Download diagnostics, then drag the file here.
      The integration removes the printer's serial number and IP address. Home Assistant adds its own section with your Home Assistant version and other custom integrations; look through it before attaching.
  validations:
    required: true
- type: textarea
  attributes:
    label: "Log entries"
    description: "Anything from Settings → System → Logs that mentions flashforge. Optional, but it helps."
    render: text
