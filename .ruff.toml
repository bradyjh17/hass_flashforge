# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"

[lint]
select = ["ALL"]

ignore = [
    "ANN101", # Missing type annotation for `self` in method
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203",   # no-blank-line-before-class (incompatible with formatter)
    "D212",   # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.per-file-ignores]
# Tests use plain asserts, pytest fixtures that are only requested for their
# side effect, and literal expected values.
"tests/**" = [
    "S101",    # assert
    "ANN001",  # fixture arguments without type annotation
    "ANN003",  # **kwargs without type annotation
    "ANN201",  # test functions without return type
    "ARG001",  # fixtures requested only for their side effect
    "PLR2004", # literal expected values
]
# Findings in code unchanged from the original project. Left as they are so
# changes from the original still merge cleanly.
"custom_components/flashforge/light.py" = [
    "ANN001", "ANN003", "ANN201", "ANN204", "ARG002", "D202", "D213", "TC001", "TC002",
]
"custom_components/flashforge/select.py" = ["B006", "ERA001"]
"tests/__init__.py" = ["EM102", "FBT001", "FBT002", "TRY003"]
"tests/conftest.py" = ["TC002"]
"tests/test_config_flow.py" = ["D202", "PGH003"]
"tests/test_sensor.py" = ["N806", "TC002"]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
