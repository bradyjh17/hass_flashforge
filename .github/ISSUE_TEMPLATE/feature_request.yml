---
name: "Feature request"
description: "Suggest an idea for the integration"
body:
- type: markdown
  attributes:
    value: |
      Please search the [existing issues](https://github.com/bradyjh17/hass_flashforge/issues?q=is%3Aissue) first.
- type: input
  attributes:
    label: "Printer model and firmware"
    placeholder: "Adventurer 5M, 5.2.0"
- type: textarea
  attributes:
    label: "What would you like?"
    description: "What problem it solves, or what you'd use it for."
  validations:
    required: true
- type: textarea
  attributes:
    label: "Anything else"
    description: "Alternatives you've considered, screenshots, links."
